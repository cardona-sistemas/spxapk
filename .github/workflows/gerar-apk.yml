name: Gerar APK RotaSPX

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Instalar Gradle no Sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y gradle

    - name: Compilar APK (Debug)
      working-directory: ./app-auxiliar-android
      run: |
        gradle assembleDebug --stacktrace

    - name: Salvar o APK gerado
      uses: actions/upload-artifact@v4
      with:
        name: Assistente-RotaSPX-APK
        path: app-auxiliar-android/app/build/outputs/apk/debug/app-debug.apk
      with:
        name: Assistente-RotaSPX-APK
        path: app-auxiliar-android/app/build/outputs/apk/debug/app-debug.apk
